<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 驱动的测试用例设计工具 Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Helvetica Neue', 'Arial', 'sans-serif';
            background-color: #f0f2f5;
        }
        /* 绘制连接线 */
        .mindmap-node {
            position: relative;
            padding-left: 50px;
            margin-top: 10px;
        }
        .mindmap-node:not(:first-child) {
            margin-top: 20px;
        }
        .mindmap-node::before, .mindmap-node::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            border-color: #a0aec0;
        }
        /* 水平线 */
        .mindmap-node::before {
            border-top: 2px solid #a0aec0;
            width: 25px;
            height: 0;
            margin-top: -1px;
        }
        /* 垂直线 */
        .mindmap-node:not(:last-child)::after {
            border-left: 2px solid #a0aec0;
            height: calc(100% + 20px);
            width: 0;
            top: 0;
        }
        .mindmap-node:last-child::after {
            border-left: 2px solid #a0aec0;
            height: 50%;
            width: 0;
            top: 0;
        }
        .mindmap-root > .mindmap-node-content {
            margin-left: -50px;
        }
        .mindmap-root > .mindmap-node::before, .mindmap-root > .mindmap-node::after {
            display: none;
        }

        .node-content {
            transition: all 0.3s ease;
            min-height: 52px;
        }

        .node-content:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .api-settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4 sm:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-xl p-6 sm:p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-900">AI 驱动的测试用例设计工具</h1>
            <p class="mt-2 text-gray-500">输入一个需求，然后点击 🤖 按钮，让 AI 逐级为您生成功能点、测试点和详细用例。</p>
        </div>

        <div class="flex justify-center mb-6">
            <button id="download-btn" onclick="exportToCSV()" class="bg-green-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-600 transition-colors shadow-md flex items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm-1-7a1 1 0 011.707-.707l3.586 3.586 3.586-3.586A1 1 0 1113.293 11L10 14.293 6.707 11A1 1 0 016 10H3z" clip-rule="evenodd" />
                </svg>
                <span>下载测试用例 (CSV)</span>
            </button>
        </div>
        
        <!-- API Settings -->
        <div class="mb-6 bg-blue-50 border-l-4 border-blue-500 text-blue-800 p-4 rounded-lg">
            <p class="font-bold text-lg mb-2">🤖 AI 模型连接设置</p>
            <p class="text-sm mb-4">在此配置您希望使用的AI模型。设置将自动保存在您的浏览器中。</p>
            <div class="api-settings-grid">
                <div>
                    <label for="apiTypeSelect" class="block text-sm font-medium text-gray-700">API 类型</label>
                    <select id="apiTypeSelect" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        <option value="gemini">Google Gemini</option>
                        <option value="openai">OpenAI 兼容 (包括本地模型)</option>
                    </select>
                </div>
                <div>
                    <label for="apiUrlInput" class="block text-sm font-medium text-gray-700">API Endpoint URL</label>
                    <input type="text" id="apiUrlInput" placeholder="例如: https://generativelanguage.googleapis.com" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="apiKeyInput" class="block text-sm font-medium text-gray-700">API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="输入您的 API Key" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="modelNameInput" class="block text-sm font-medium text-gray-700">模型名称</label>
                    <input type="text" id="modelNameInput" placeholder="例如: gemini-2.5-flash-preview-05-20" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>
        </div>

        <!-- Mindmap Container -->
        <div id="mindmap-container" class="mindmap-root">
            <!-- The mindmap will be rendered here -->
        </div>

        <!-- Loading Modal -->
        <div id="loading-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg p-6 flex items-center space-x-4 shadow-lg">
                <div class="loader"></div>
                <span class="text-lg font-medium text-gray-700">AI 正在思考中，请稍候...</span>
            </div>
        </div>

        <!-- Error Modal -->
         <div id="error-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg p-8 shadow-xl text-center max-w-sm">
                <h3 class="text-2xl font-bold text-red-600 mb-4">发生错误</h3>
                <p id="error-message" class="text-gray-600 mb-6"></p>
                <button onclick="document.getElementById('error-modal').classList.add('hidden')" class="bg-red-500 text-white font-bold py-2 px-6 rounded-lg hover:bg-red-600 transition-colors">
                    关闭
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA ---
        let treeData = {
            id: 'root',
            text: '开发一个电商平台的商品评论和评级系统',
            type: 'requirement',
            children: []
        };
        // 简化节点类型，移除了 'precondition'
        const nodeTypes = ['requirement', 'feature', 'test_point', 'test_case_final'];

        // --- API SETTINGS ---
        const settings = {
            apiType: document.getElementById('apiTypeSelect'),
            apiUrl: document.getElementById('apiUrlInput'),
            apiKey: document.getElementById('apiKeyInput'),
            modelName: document.getElementById('modelNameInput'),
        };

        function saveSettings() {
            const config = {
                apiType: settings.apiType.value,
                apiUrl: settings.apiUrl.value,
                apiKey: settings.apiKey.value,
                modelName: settings.modelName.value,
            };
            localStorage.setItem('aiApiConfig', JSON.stringify(config));
        }

        function loadSettings() {
            const savedConfig = localStorage.getItem('aiApiConfig');
            const defaultConfig = {
                apiType: 'gemini',
                apiUrl: 'https://generativelanguage.googleapis.com',
                apiKey: '',
                modelName: 'gemini-2.5-flash-preview-05-20',
            };
            const config = savedConfig ? JSON.parse(savedConfig) : defaultConfig;

            settings.apiType.value = config.apiType;
            settings.apiUrl.value = config.apiUrl;
            settings.apiKey.value = config.apiKey;
            settings.modelName.value = config.modelName;

            updateApiUrlPlaceholder();
        }

        function updateApiUrlPlaceholder() {
            if (settings.apiType.value === 'gemini') {
                settings.apiUrl.placeholder = '例如: https://generativelanguage.googleapis.com';
            } else {
                settings.apiUrl.placeholder = '例如: http://localhost:1234/v1/chat/completions';
            }
        }
        
        Object.values(settings).forEach(input => input.addEventListener('change', saveSettings));
        settings.apiType.addEventListener('change', updateApiUrlPlaceholder);

        // --- API CALL ---
        async function callAIAPI(prompt, retries = 5, delay = 2000) { // 增加重试次数
            const config = JSON.parse(localStorage.getItem('aiApiConfig') || '{}');
            if (!config.apiKey || !config.apiUrl || !config.modelName) {
                showError("请先在设置中填写完整的 API 信息 (URL, Key, 和模型名称)。");
                return null;
            }

            let url, body, headers;

            if (config.apiType === 'gemini') {
                url = `${config.apiUrl}/v1beta/models/${config.modelName}:generateContent?key=${config.apiKey}`;
                headers = { 'Content-Type': 'application/json' };
                body = JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] });
            } else { // OpenAI-Compatible
                url = config.apiUrl;
                headers = {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${config.apiKey}`
                };
                body = JSON.stringify({
                    model: config.modelName,
                    messages: [{ role: 'user', content: prompt }],
                    stream: false
                });
            }
            
            showLoading(true);

            try {
                const response = await fetch(url, { method: 'POST', headers, body });

                if (!response.ok) {
                    const errorBody = await response.text();
                    throw new Error(`API 请求失败: ${response.status} ${response.statusText}. 详情: ${errorBody}`);
                }

                const result = await response.json();
                let text;
                if (config.apiType === 'gemini') {
                    text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                } else { // OpenAI-Compatible
                    text = result.choices?.[0]?.message?.content;
                }
                
                if (!text) throw new Error('API 返回了无效的响应格式。');
                
                // 移除 <think> 标签及其内容
                const cleanedText = text.replace(/<think>[\s\S]*?<\/think>/g, '').trim();

                return cleanedText;

            } catch (error) {
                console.error("API Call Error:", error);
                if (retries > 0) {
                    // 增加 Jitter (随机抖动) 来避免同时重试
                    const jitter = Math.random() * 1000; // 0-1s jitter
                    const waitTime = delay + jitter;
                    console.log(`API overload detected. Retrying in ${Math.round(waitTime / 1000)} seconds... (${retries} attempts left)`);
                    await new Promise(res => setTimeout(res, waitTime));
                    return callAIAPI(prompt, retries - 1, delay * 2); // Exponential backoff for next retry
                } else {
                    showError(`调用AI失败: ${error.message}`);
                    return null;
                }
            } finally {
                showLoading(false);
            }
        }

        // --- RENDERING ---
        function renderNode(node, level = 0) {
            const nodeType = node.type;
            const nextNodeType = nodeTypes[nodeTypes.indexOf(nodeType) + 1];

            const labels = {
                requirement: '测试需求',
                feature: '功能点',
                test_point: '测试点',
                test_case_final: '测试用例详情' // 标签更新
            };
            const labelText = labels[nodeType] || '';

            let contentHTML;
            if (nodeType === 'test_case_final' && typeof node.details === 'object') {
                // 更新UI以显示前置条件、步骤和结果
                contentHTML = `
                    <div class="p-4 rounded-lg bg-green-50 border border-green-200 w-full">
                        <strong class="text-green-800">${labelText}:</strong>
                        <div class="mt-2 text-sm text-gray-700 space-y-1">
                            <p><span class="font-semibold">前置条件:</span> ${node.details.precondition || 'N/A'}</p>
                            <p><span class="font-semibold">操作步骤:</span> ${node.details.steps || 'N/A'}</p>
                            <p><span class="font-semibold">预期结果:</span> ${node.details.expected || 'N/A'}</p>
                        </div>
                    </div>
                `;
            } else {
                contentHTML = `
                    <label class="font-semibold text-gray-600 mr-3 shrink-0 flex items-center whitespace-nowrap">${labelText}:</label>
                    <input type="text" value="${node.text}" onchange="updateNodeText('${node.id}', this.value)" 
                           class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition w-full min-w-0">
                    ${nextNodeType ? `
                    <div class="flex space-x-2 ml-4">
                        <button onclick="handleAIGenerate('${node.id}')" title="AI 生成下一级节点"
                                class="bg-blue-500 text-white p-3 rounded-lg hover:bg-blue-600 transition transform hover:scale-105 shadow-md">
                            <span class="text-xl">🤖</span>
                        </button>
                    </div>` : ''}
                `;
            }

            const childrenHTML = node.children.map(child => renderNode(child, level + 1)).join('');

            return `
                <div class="mindmap-node" data-id="${node.id}">
                    <div class="mindmap-node-content node-content flex items-center p-2 rounded-lg bg-white shadow-md">
                        ${contentHTML}
                    </div>
                    <div class="mindmap-children pl-4 border-l-2 border-gray-300 ml-6">
                        ${childrenHTML}
                    </div>
                </div>
            `;
        }
        
        function renderTree() {
            const container = document.getElementById('mindmap-container');
            container.innerHTML = renderNode(treeData);
        }

        // --- EVENT HANDLERS & LOGIC ---
        function findNodePath(root, id) {
            const path = [];
            function find(node) {
                path.push(node);
                if (node.id === id) return true;
                if (node.children) {
                    for (const child of node.children) {
                        if (find(child)) return true;
                    }
                }
                path.pop();
                return false;
            }
            if (find(root)) return path;
            return [];
        }

        function findNodeById(id) {
            const path = findNodePath(treeData, id);
            return path.length > 0 ? path[path.length - 1] : null;
        }
        
        function updateNodeText(id, newText) {
            const node = findNodeById(id);
            if (node) {
                node.text = newText;
            }
        }

        async function handleAIGenerate(id) {
            const node = findNodeById(id);
            if (!node) return;

            let prompt = '';
            const type = node.type;
            const nextNodeType = nodeTypes[nodeTypes.indexOf(type) + 1];
            const path = findNodePath(treeData, id);

            if (type === 'requirement') {
                prompt = `你是一位资深软件测试专家。请根据以下产品需求，将其拆分为5个以内的核心功能点。请只返回一个由换行符分隔的列表，不要有编号或任何其他多余的文字。\n\n需求：${node.text}`;
            } else if (type === 'feature') {
                const requirementNode = path[0];
                prompt = `你是一位资深软件测试专家。请为名为“${node.text}”的功能点设计全面的测试点，覆盖正面、负面和边界场景。父级需求是“${requirementNode.text}”。请只返回一个由换行符分隔的列表，不要有编号或任何其他多余的文字。`;
            } else if (type === 'test_point') {
                // 逻辑更新：直接生成完整的用例（前置条件、步骤、预期）
                const requirementNode = path[0];
                const featureNode = path[1];
                prompt = `你是一位资深的软件测试工程师。请为以下完整场景，编写详细的“前置条件”、“操作步骤”和“预期结果”。\n\n- 需求: ${requirementNode.text}\n- 功能点: ${featureNode.text}\n- 测试点: ${node.text}\n\n请严格按照以下JSON格式返回，并且JSON必须在同一行，不要包含任何换行符或多余的文字说明：{"precondition": "详细的前置条件", "steps": "详细的操作步骤", "expected": "明确的预期结果"}`;
            
            // 移除了旧的 'precondition' 逻辑
            }

            const result = await callAIAPI(prompt);
            if (!result) return;
            
            node.children = [];

            if (nextNodeType === 'test_case_final') {
                try {
                    // 确保AI返回的JSON字符串干净
                    const sanitizedResult = result.replace(/```json/g, '').replace(/```/g, '').replace('json', '').trim();
                    const parsed = JSON.parse(sanitizedResult);
                    node.children.push({
                        id: `tcf-${Date.now()}`,
                        text: `最终用例`,
                        type: 'test_case_final',
                        details: parsed, // 'details' 现在包含 {precondition, steps, expected}
                        children: []
                    });
                } catch (e) {
                    console.error("JSON parsing error:", e, "Raw result:", result);
                    showError("AI返回的用例格式无法解析，请重试。");
                }
            } else {
                const items = result.split('\n').filter(item => item.trim() !== '');
                items.forEach((item, index) => {
                    node.children.push({
                        id: `${nextNodeType.slice(0,2)}-${id}-${index}`,
                        text: item.trim().replace(/^\d+\.\s*/, ''),
                        type: nextNodeType,
                        children: []
                    });
                });
            }
            renderTree();
        }

        // --- UTILITY FUNCTIONS ---
        function showLoading(isLoading) {
            document.getElementById('loading-modal').classList.toggle('hidden', !isLoading);
        }

        function showError(message) {
            document.getElementById('error-message').textContent = message;
            document.getElementById('error-modal').classList.remove('hidden');
        }

        function escapeCSV(field) {
            if (field === null || field === undefined) return '""';
            const str = String(field);
            if (str.search(/("|,|\n)/g) >= 0) {
                return `"${str.replace(/"/g, '""')}"`;
            }
            return str;
        }

        function exportToCSV() {
            const csvRows = [];
            // CSV 头保持不变
            const headers = ['测试需求', '功能点', '测试点', '前置条件', '操作步骤', '预期结果'];
            csvRows.push(headers.join(','));

            function findTestCases(node, path) {
                // 路径逻辑不变，因为'test_case_final'的父节点是'test_point'
                const newPath = node.type !== 'test_case_final' ? [...path, node.text] : path;

                if (node.type === 'test_case_final' && node.details) {
                    // 更新CSV行数据以匹配新的数据结构
                    const rowData = [
                        path[0] || '', // requirement
                        path[1] || '', // feature
                        path[2] || '', // test_point
                        node.details.precondition || '', // 从 details 中获取
                        node.details.steps || '',
                        node.details.expected || ''
                    ];
                    csvRows.push(rowData.map(escapeCSV).join(','));
                }

                if (node.children && node.children.length > 0) {
                    node.children.forEach(child => findTestCases(child, newPath));
                }
            }

            findTestCases(treeData, []);

            if (csvRows.length <= 1) {
                showError("没有可供下载的测试用例。请先生成一些用例。");
                return;
            }

            const csvContent = csvRows.join('\n');
            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");

            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", "test_cases.csv");
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            renderTree();
        });
    </script>

</body>
</html>
